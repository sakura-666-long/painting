<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>选画</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', serif;
        }
        body{
            background-color: #F4F0E3;
            background-image: url('https://cdn.pixabay.com/photo/2017/08/02/14/26/paper-2574920_1280.jpg');
            background-repeat: repeat;
            color:#2D2D2D;
        }
        header{
            display:flex;
            justify-content: space-between;
            padding:1rem 6rem;
            border-bottom: 1px solid #8C5A2F50;
            align-items:center;
        }
        .logo{
            font-size:24px;
            font-weight:bold;
        }
        nav a{
            text-decoration:none;
            color:#2D2D2D;
            margin:0 14px;
            font-size:17px;
        }
        .container{
            width:90%;
            margin:30px auto;
            display:grid;
            grid-template-columns:320px 1fr;
            gap:24px;
        }
        .form-card{
            background:#fffdf7;
            border:2px solid #8C5A2F;
            border-radius:8px;
            padding:24px;
        }
        .form-card h3{
            color:#8C5A2F;
            margin-bottom:18px;
            text-align:center;
        }
        .form-item{
            margin-bottom:16px;
        }
        label{
            display:block;
            margin-bottom:6px;
        }
        input{
            width:100%;
            padding:8px;
            border:1px solid #8C5A2F70;
            border-radius:4px;
            background:#fff;
        }
        .btn{
            width:100%;
            padding:10px;
            background:#8C5A2F;
            color:#fff;
            border:none;
            border-radius:4px;
            font-size:16px;
            cursor:pointer;
            margin-top:8px;
        }
        .btn:hover{
            background:#704824;
        }
        .gallery{
            background:#fffdf7;
            border:2px solid #8C5A2F;
            border-radius:8px;
            padding:24px;
        }
        .gallery h3{
            color:#8C5A2F;
            text-align:center;
            margin-bottom:20px;
        }
        .art-grid{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:16px;
        }
        .art-card{
            border:1px solid #8C5A2F40;
            padding:10px;
            cursor:pointer;
            position:relative;
        }
        .art-card img{
            width:100%;
            height:160px;
            object-fit:contain;
        }
        .art-card .source-link{
            display:block;
            text-align:center;
            font-size:13px;
            color:#8C5A2F;
        }
        .del-btn{
            position:absolute;
            top:4px;
            right:4px;
            background:#c43a31;
            color:#fff;
            border:none;
            border-radius:4px;
            padding:2px 6px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🖌️ 国画定制｜选画</div>
        <nav>
            <a href="./index.html">首页</a>
            <a href="./select.html">选画</a>
            <a href="./preview.html">虚拟预览</a>
            <a href="./color.html">调色</a>
            <a href="./order.html">订单</a>
        </nav>
    </header>
    <div class="container">
        <div class="form-card">
            <h3>添加画作到图库</h3>
            <div class="form-item">
                <label>作品详情网页链接</label>
                <input type="text" id="detailUrl" placeholder="粘贴画作详情页面网址">
            </div>
            <div class="form-item">
                <label>图片直链（画作图片地址）</label>
                <input type="text" id="imgUrl" placeholder="粘贴图片本身地址">
            </div>
            <div class="form-item">
                <label>画作名称</label>
                <input type="text" id="imgName" placeholder="例如旭日东升">
            </div>
            <button class="btn" onclick="addUrlImage()">添加到图库</button>
            <div class="form-item" style="margin-top:12px">
                <label>或者上传本地图片（可不填详情链接）</label>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
        </div>
        <div class="gallery">
            <h3>国画图库（点击画作进入虚拟预览）</h3>
            <div class="art-grid" id="galleryWrap">
                <!-- JS动态渲染图库 -->
            </div>
        </div>
    </div>
    <script>
        let artList = JSON.parse(localStorage.getItem("artGallery")) || [
            {
                src:"https://picsum.photos/id/1015/800/600",
                name:"山水测试图",
                detailUrl:"https://picsum.photos/id/1015"
            },
            {
                src:"https://picsum.photos/id/1025/800/600",
                name:"花鸟测试图",
                detailUrl:"https://picsum.photos/id/1025"
            },
            {
                src:"https://picsum.photos/id/1036/800/600",
                name:"人物测试图",
                detailUrl:"https://picsum.photos/id/1036"
            }
        ];

        function renderGallery(){
            const wrap = document.getElementById("galleryWrap");
            wrap.innerHTML = "";
            artList.forEach((item,index)=>{
                const div = document.createElement("div");
                div.className = "art-card";
                let sourceHtml = '';
                if(item.detailUrl){
                    sourceHtml = `<a class="source-link" href="${item.detailUrl}" target="_blank">查看作品详情</a>`;
                }else{
                    sourceHtml = `<span class="source-link">本地上传图片</span>`;
                }
                div.innerHTML = `
                    <button class="del-btn" onclick="delArt(${index},event)">×</button>
                    <img src="${item.src}" alt="${item.name}">
                    ${sourceHtml}
                    <p>${item.name}</p>
                `;
                div.onclick = function(){
                    goPreview(item.src);
                }
                wrap.appendChild(div);
            })
        }
        function saveGallery(){
            localStorage.setItem("artGallery",JSON.stringify(artList));
        }
        function delArt(index,e){
            e.stopPropagation();
            artList.splice(index,1);
            saveGallery();
            renderGallery();
        }
        function addUrlImage(){
            const detailUrl = document.getElementById("detailUrl").value.trim();
            const url = document.getElementById("imgUrl").value.trim();
            const name = document.getElementById("imgName").value.trim() || "国画作品";
            if(!url){
                alert("请填写图片直链！");
                return;
            }
            artList.push({
                src:url,
                name:name,
                detailUrl: detailUrl
            });
            saveGallery();
            renderGallery();
            document.getElementById("detailUrl").value = "";
            document.getElementById("imgUrl").value = "";
            document.getElementById("imgName").value = "";
            alert("图片已成功加入图库！卡片可点击【查看作品详情】访问原作页面");
        }
        document.getElementById("fileInput").onchange = function(e){
            const files = e.target.files;
            for(let file of files){
                const reader = new FileReader();
                reader.onload = function(ev){
                    artList.push({
                        src:ev.target.result,
                        name:file.name,
                        detailUrl:""
                    })
                    saveGallery();
                    renderGallery();
                }
                reader.readAsDataURL(file);
            }
            alert("本地图片添加成功！");
        }
        function goPreview(imgSrc){
            window.location.href = `preview.html?img=${encodeURIComponent(imgSrc)}`;
        }
        renderGallery();
    </script>
</body>
</html>
