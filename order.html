<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>成品交付溯源</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', serif;
        }
        body{
            background-color: #F4F0E3;
            background-image: url('https://cdn.pixabay.com/photo/2017/08/02/14/26/paper-2574920_1280.jpg');
            background-repeat: repeat;
            color:#2D2D2D;
        }
        header{
            display:flex;
            justify-content: space-between;
            padding:1rem 6rem;
            border-bottom: 1px solid #8C5A2F50;
            align-items:center;
        }
        .logo{
            font-size:24px;
            font-weight:bold;
        }
        nav a{
            text-decoration:none;
            color:#2D2D2D;
            margin:0 14px;
            font-size:17px;
        }
        .wrap{
            width:90%;
            margin:30px auto;
        }
        .order-card{
            background:#fffdf7;
            border:2px solid #8C5A2F;
            border-radius:8px;
            padding:28px;
        }
        h2{
            color:#8C5A2F;
            text-align:center;
            margin-bottom:24px;
        }
        .progress{
            display:flex;
            justify-content:space-between;
            margin-bottom:30px;
        }
        .step{
            text-align:center;
        }
        .step-dot{
            width:30px;
            height:30px;
            background:#8C5A2F;
            color:#fff;
            border-radius:50%;
            line-height:30px;
            margin:0 auto 8px;
        }
        .step-dot.grey{
            background:#bbb;
        }
        .frame-grid{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:20px;
            margin:24px 0;
        }
        .frame-item{
            border:1px solid #8C5A2F50;
            padding:16px;
            text-align:center;
            cursor:pointer;
            border-radius:6px;
            transition: all 0.3s;
        }
        .frame-item:hover{
            background:#f3ece0;
        }
        .frame-item.active{
            background:#e9ddc9;
            border:2px solid #8C5A2F;
        }
        /* 画框预览容器，用来叠加相框效果 */
        .frame-preview-wrap{
            display: inline-block;
            padding:0;
        }
        #orderImg{
            max-height:320px;
            display:block;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .art-preview{
            text-align:center;
            margin:20px 0;
        }
        .param-info{
            background:#f7f2e6;
            border:1px solid #8C5A2F40;
            padding:14px;
            margin:16px 0;
            border-radius:6px;
        }
        .param-info p{
            line-height:1.7;
        }
        .btn{
            padding:12px 30px;
            background:#8C5A2F;
            color:#fff;
            border:none;
            border-radius:4px;
            font-size:18px;
            cursor:pointer;
            display:block;
            margin:20px auto;
        }
        .btn:hover{
            background:#704824;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🖌丹青画境️ ｜成品交付溯源</div>
        <nav>
            <a href="./index.html">首页</a>
            <a href="./select.html">需求对接归集</a>
            <a href="./preview.html">智能选画与场景预演</a>
            <a href="./color.html">数字调色确认</a>
            <a href="./order.html">成品交付溯源</a>
        </nav>
    </header>
    <div class="wrap">
        <div class="order-card">
            <h2>订单全流程可视化管理</h2>
            <!-- 订单进度条 -->
            <div class="progress">
                <div class="step">
                    <div class="step-dot">1</div>
                    <p>需求提交</p>
                </div>
                <div class="step">
                    <div class="step-dot">2</div>
                    <p>设计选画</p>
                </div>
                <div class="step">
                    <div class="step-dot">3</div>
                    <p>调色确认</p>
                </div>
                <div class="step">
                    <div class="step-dot grey" id="step4">4</div>
                    <p>装裱制作</p>
                </div>
                <div class="step">
                    <div class="step-dot grey" id="step5">5</div>
                    <p>发货配送</p>
                </div>
            </div>

            <div class="art-preview">
                <p>当前定制国画（素材来源 <a href="https://hetuwang.cn" target="_blank">hetuwang.cn</a>）</p>
                <!-- 相框外层容器，通过修改padding+border模拟画框 -->
                <div class="frame-preview-wrap" id="frameWrap">
                    <img id="orderImg">
                </div>
            </div>

            <!-- 调色参数展示区域（完整新增参数） -->
            <div class="param-info" id="paramBox">
                <h4 style="color:#8C5A2F;margin-bottom:8px;">调色记录与备注</h4>
                <p id="paramText"></p>
            </div>

            <h3 style="text-align:center;color:#8C5A2F">选择成品工艺（点击预览效果）</h3>
            <div class="frame-grid">
                <div class="frame-item" onclick="selectFrame('frame-in-frame')">
                    <h4>画中画</h4>
                    <p>内画框实木封边，外框黑胡桃木铜角框，画面采用悬浮工艺</p>
                </div>
                <div class="frame-item" onclick="selectFrame('relief')">
                    <h4>浮雕画</h4>
                    <p>肌理浮雕工艺，呈现立体线条与立体图形效果</p>
                </div>
                <div class="frame-item" onclick="selectFrame('screen')">
                    <h4>蝴蝶结屏风</h4>
                    <p>传统蝴蝶结链接，框条连接传统燕尾榫，打磨后融合一体</p>
                </div>
            </div>
            <button class="btn" onclick="submitOrder()">提交订单，进入装裱制作</button>
            <p style="text-align:center">安全包装配送，生成线上订单档案，随时查看进度</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // 获取color页面全部传参
        let imgSrc = urlParams.get('img') ? decodeURIComponent(urlParams.get('img')) : "";
        const bright = urlParams.get('bright') || 100;
        const contrast = urlParams.get('contrast') || 100;
        const saturate = urlParams.get('saturate') || 100;
        const hue = urlParams.get('hue') || 0;
        const temp = urlParams.get('temp') || 0;
        const shadow = urlParams.get('shadow') || 0;
        const sharp = urlParams.get('sharp') || 0;
        const rotate = urlParams.get('rotate') || 0;
        const mirror = urlParams.get('mirror') === "true";
        const paperFilter = urlParams.get('paperFilter') === "true";
        const remark = urlParams.get('remark') ? decodeURIComponent(urlParams.get('remark')) : "无备注";

        const orderImgDom = document.getElementById("orderImg");
        const frameWrap = document.getElementById("frameWrap");
        const paramText = document.getElementById("paramText");

        // 复现调色滤镜，和color页面保持一模一样
        if(imgSrc){
            orderImgDom.src = imgSrc;
            let filters = [];
            filters.push(`brightness(${bright}%)`);
            filters.push(`contrast(${contrast}%)`);
            filters.push(`saturate(${saturate}%)`);
            filters.push(`hue-rotate(${hue}deg)`);

            if(temp < 0){
                filters.push(`sepia(${Math.abs(temp) / 200})`);
            }else if(temp > 0){
                filters.push(`saturate(${Number(saturate) + Math.round(temp / 10)}%)`);
            }

            if(shadow != 0){
                filters.push(`brightness(${Number(bright) + Math.round(shadow / 8)}%)`);
                filters.push(`contrast(${Number(contrast) - Math.round(Math.abs(shadow) / 10)}%)`);
            }

            if(sharp > 0){
                filters.push(`contrast(${Number(contrast) + Math.round(sharp / 5)}%)`);
                filters.push(`saturate(${Number(saturate) + Math.round(sharp / 8)}%)`);
            }

            if(paperFilter){
                filters.push(`sepia(0.35)`);
                filters.push(`saturate(115%)`);
                orderImgDom.style.boxShadow = "inset 0 0 60px rgba(120, 80, 40, 0.35)";
            }

            orderImgDom.style.filter = filters.join(" ");
            let scaleX = mirror ? -1 : 1;
            orderImgDom.style.transform = `rotate(${rotate}deg) scaleX(${scaleX})`;
        }

        // 展示全部调色参数
        paramText.innerHTML = `
亮度：${bright}% &nbsp;&nbsp;对比度：${contrast}% &nbsp;&nbsp;饱和度：${saturate}%<br>
色相：${hue}° &nbsp;&nbsp;色温：${temp} &nbsp;&nbsp;暗部提亮：${shadow} &nbsp;&nbsp;清晰度：${sharp}<br>
旋转：${rotate}° &nbsp;&nbsp;水平镜像：${mirror ? "开启" : "关闭"} &nbsp;&nbsp;宣纸滤镜：${paperFilter ? "开启" : "关闭"}<br>
改图备注：${remark}
        `;

        // 三种成品工艺样式配置
        const frameStyleList = {
            "frame-in-frame": {
                border: "10px solid #d9c7a9",
                padding: "4px",
                boxShadow: "0 6px 16px rgba(0,0,0,0.35)",
                innerBorder: "2px solid #8C5A2F"
            },
            "relief": {
                border: "12px solid #b9894f",
                padding: "10px",
                boxShadow: "0 10px 24px rgba(0,0,0,0.45)",
                innerBorder: "3px solid #6b4423"
            },
            "screen": {
                border: "8px solid #c9b591",
                padding: "6px",
                boxShadow: "0 4px 14px rgba(0,0,0,0.3)",
                innerBorder: "2px solid #8C5A2F"
            }
        };
        let currentFrameKey = "";

        // 选中工艺预览
        function selectFrame(type){
            currentFrameKey = type;
            document.querySelectorAll(".frame-item").forEach(el=>el.classList.remove("active"));
            event.currentTarget.classList.add("active");

            const style = frameStyleList[type];
            frameWrap.style.border = style.border;
            frameWrap.style.padding = style.padding;
            frameWrap.style.boxShadow = style.boxShadow;

            if (style.innerBorder) {
                orderImgDom.style.border = style.innerBorder;
            } else {
                orderImgDom.style.border = "none";
            }
        }

        // 提交订单，更新进度
        function submitOrder(){
            if(!currentFrameKey){
                alert("请先选择一款成品工艺！");
                return;
            }
            // 工艺名称映射
            const frameName = {
                "frame-in-frame": "画中画",
                "relief": "浮雕画",
                "screen": "蝴蝶结屏风"
            }[currentFrameKey];

            document.getElementById("step4").classList.remove("grey");
            alert(`订单提交成功！已选择【${frameName}】工艺，订单档案已保存`);
        }
    </script>
</body>
</html>
