<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>成品交付溯源</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', serif;
        }
        body{
            background-color: #F4F0E3;
            background-image: url('https://cdn.pixabay.com/photo/2017/08/02/14/26/paper-2574920_1280.jpg');
            background-repeat: repeat;
            color:#2D2D2D;
        }
        header{
            display:flex;
            justify-content: space-between;
            padding:1rem 6rem;
            border-bottom: 1px solid #8C5A2F50;
            align-items:center;
        }
        .logo{
            font-size:24px;
            font-weight:bold;
        }
        nav a{
            text-decoration:none;
            color:#2D2D2D;
            margin:0 14px;
            font-size:17px;
        }
        .wrap{
            width:90%;
            margin:30px auto;
        }
        .order-card{
            background:#fffdf7;
            border:2px solid #8C5A2F;
            border-radius:8px;
            padding:28px;
        }
        h2{
            color:#8C5A2F;
            text-align:center;
            margin-bottom:24px;
        }
        .progress{
            display:flex;
            justify-content:space-between;
            margin-bottom:30px;
        }
        .step{
            text-align:center;
        }
        .step-dot{
            width:30px;
            height:30px;
            background:#8C5A2F;
            color:#fff;
            border-radius:50%;
            line-height:30px;
            margin:0 auto 8px;
        }
        .step-dot.grey{
            background:#bbb;
        }
        .frame-grid{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:20px;
            margin:24px 0;
        }
        .frame-item{
            border:1px solid #8C5A2F50;
            padding:16px;
            text-align:center;
            cursor:pointer;
        }
        .frame-item:hover{
            background:#f3ece0;
        }
        .art-preview{
            text-align:center;
            margin:20px 0;
        }
        #orderImg{
            max-height:320px;
        }
        .btn{
            padding:12px 30px;
            background:#8C5A2F;
            color:#fff;
            border:none;
            border-radius:4px;
            font-size:18px;
            cursor:pointer;
            display:block;
            margin:20px auto;
        }
        .btn:hover{
            background:#704824;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🖌丹青画境️ ｜成品交付溯源</div>
        <nav>
            <a href="./index.html">首页</a>
            <a href="./select.html">需求对接归集</a>
            <a href="./preview.html">智能选画与场景预演</a>
            <a href="./color.html">数字调色确认</a>
            <a href="./order.html">成品交付溯源</a>
        </nav>
    </header>
    <div class="wrap">
        <div class="order-card">
            <h2>订单全流程可视化管理</h2>
            <!-- 订单进度条 -->
            <div class="progress">
                <div class="step">
                    <div class="step-dot">1</div>
                    <p>需求提交</p>
                </div>
                <div class="step">
                    <div class="step-dot">2</div>
                    <p>设计选画</p>
                </div>
                <div class="step">
                    <div class="step-dot">3</div>
                    <p>调色确认</p>
                </div>
                <div class="step">
                    <div class="step-dot grey">4</div>
                    <p>装裱制作</p>
                </div>
                <div class="step">
                    <div class="step-dot grey">5</div>
                    <p>发货配送</p>
                </div>
            </div>
            <div class="art-preview">
                <p>当前定制国画（素材来源 <a href="https://hetuwang.cn" target="_blank">hetuwang.cn</a>）</p>
                <img id="orderImg">
            </div>
            <h3 style="text-align:center;color:#8C5A2F">选择相框款式</h3>
            <div class="frame-grid">
                <div class="frame-item">
                    <h4>原木简约框</h4>
                    <p>自然原木，素雅国风</p>
                </div>
                <div class="frame-item">
                    <h4>红棕复古框</h4>
                    <p>传统中式，适合山水</p>
                </div>
                <div class="frame-item">
                    <h4>黑色窄边框</h4>
                    <p>现代极简，工笔花鸟</p>
                </div>
            </div>
            <button class="btn" onclick="submitOrder()">提交订单，进入装裱制作</button>
            <p style="text-align:center">安全包装配送，生成线上订单档案，随时查看进度</p>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let imgSrc = urlParams.get('img') ? decodeURIComponent(urlParams.get('img')) : "";
        const orderImgDom = document.getElementById("orderImg");
        if(imgSrc){
            orderImgDom.src = imgSrc;
        }
        function submitOrder(){
            alert("订单提交成功！开始装裱制作，订单档案已保存");
        }
    </script>
</body>
</html>
