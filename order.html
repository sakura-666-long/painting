<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>成品交付溯源</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Noto Serif SC', serif;
  }

  body {
    background-color: #F4F0E3;
    background-image: url('https://cdn.pixabay.com/photo/2017/08/02/14/26/paper-2574920_1280.jpg');
    background-repeat: repeat;
    color: #2D2D2D;
  }

  header {
    display: flex;
    justify-content: space-between;
    padding: 1rem 6rem;
    border-bottom: 1px solid #8C5A2F50;
    align-items: center;
  }

  .logo {
    font-size: 24px;
    font-weight: bold;
  }

  nav a {
    text-decoration: none;
    color: #2D2D2D;
    margin: 0 14px;
    font-size: 17px;
  }

  .wrap {
    width: 90%;
    margin: 30px auto;
  }

  .order-card {
    background: #fffdf7;
    border: 2px solid #8C5A2F;
    border-radius: 8px;
    padding: 28px;
  }

  h2 {
    color: #8C5A2F;
    text-align: center;
    margin-bottom: 24px;
  }

  .progress {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
  }

  .step {
    text-align: center;
  }

  .step-dot {
    width: 30px;
    height: 30px;
    background: #8C5A2F;
    color: #fff;
    border-radius: 50%;
    line-height: 30px;
    margin: 0 auto 8px;
  }

  .step-dot.grey {
    background: #bbb;
  }

  .frame-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 24px 0;
  }

  .frame-item {
    border: 1px solid #8C5A2F50;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.3s;
  }

  .frame-item:hover {
    background: #f3ece0;
  }

  .frame-item.active {
    background: #e9ddc9;
    border: 2px solid #8C5A2F;
  }

  .art-preview {
    text-align: center;
    margin: 20px 0;
  }

  .param-info {
    background: #f7f2e6;
    border: 1px solid #8C5A2F40;
    padding: 14px;
    margin: 16px 0;
    border-radius: 6px;
  }

  .param-info p {
    line-height: 1.7;
  }

  .btn {
    padding: 12px 30px;
    background: #8C5A2F;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
    display: block;
    margin: 20px auto;
  }

  .btn:hover {
    background: #704824;
  }

  /* ========== 预览容器 ========== */
  .frame-preview-wrap {
    display: inline-block;
    padding: 0;
    position: relative;
    isolation: isolate;
    background: #fff;
  }

  .inner-frame {
    padding: 4px;
    border: 2px solid #b82626;
    background: #fff;
    display: block;
  }

  #orderImg {
    max-height: 320px;
    display: block;
    transition: all 0.4s ease;
    border: none;
  }

  /* ========== 画中画 ========== */
  .style-frame-in-frame .frame-preview-wrap {
    border: 14px solid #b49b7c;
    padding: 6px;
    box-shadow:
      0 10px 24px rgba(0, 0, 0, 0.35),
      0 2px 6px rgba(0, 0, 0, 0.2);
    border-radius: 2px;
  }

  .style-frame-in-frame .inner-frame {
    border: 2px solid #b82626;
    padding: 4px;
    box-shadow: inset 0 0 0 1px #fff, 0 2px 8px rgba(0, 0, 0, 0.15);
  }

  /* ========== 浮雕画：强凹凸版本 ========== */
  .style-relief .frame-preview-wrap {
    border: 1px solid #d9c7a9;
    padding: 18px;
    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.55),
      0 6px 14px rgba(0, 0, 0, 0.35);
    background: linear-gradient(180deg, #f6ecd7 0%, #e7d2a6 100%);
    position: relative;
  }

  .style-relief .frame-preview-wrap::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(120, 80, 30, 0.35);
    border-radius: 2px;
    pointer-events: none;
  }

  .style-relief .inner-frame {
    border: none;
    padding: 0;
    background: transparent;
  }

  .style-relief #orderImg {
    display: block;
    border-radius: 2px;

    /* 浮雕凸起贴层 */
    padding: 14px 16px;
    background:
      linear-gradient(180deg,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(255, 255, 255, 0.08) 40%,
        rgba(0, 0, 0, 0.06) 60%,
        rgba(0, 0, 0, 0.22) 100%);

    box-shadow:
      inset 0 0 50px rgba(70, 40, 10, 0.55),
      inset 0 6px 12px rgba(255, 255, 255, 0.45),
      inset 0 -8px 16px rgba(0, 0, 0, 0.45),
      0 18px 30px rgba(0, 0, 0, 0.5),
      0 4px 10px rgba(0, 0, 0, 0.35);

    transform:
      translateY(-6px)
      perspective(1400px)
      rotateX(2.6deg)
      rotateY(-1.2deg);

    filter: contrast(1.35) brightness(1.08) saturate(1.02);
  }

  /* 浮雕外框立体阴影 */
  .style-relief .frame-preview-wrap::after {
    content: "";
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 8px;
    height: 14px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 70%);
    filter: blur(4px);
    z-index: -1;
  }

  /* 左上高光，右下重阴影 */
  .style-relief .relief-top-light,
  .style-relief .relief-bottom-shadow {
    position: absolute;
    left: 18px;
    right: 18px;
    height: 40px;
    pointer-events: none;
    z-index: 3;
    border-radius: 2px;
  }

  .style-relief .relief-top-light {
    top: 18px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
  }

  .style-relief .relief-bottom-shadow {
    bottom: 18px;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0));
  }

  /* ========== 折屏：三根细线，中间反向 ========== */
  .style-screen .frame-preview-wrap {
    border: 9px solid #b9a47d;
    padding: 0;
    box-shadow:
      0 10px 22px rgba(0, 0, 0, 0.35),
      inset 0 0 0 2px #8C5A2F;
    border-radius: 3px;
  }

  .style-screen .inner-frame {
    border: none;
    padding: 0;
  }

  .screen-divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 14px;
    z-index: 3;
    pointer-events: none;
    display: none;
  }

  .screen-divider .bar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(92, 68, 32, 0.5) 40%,
      rgba(92, 68, 32, 1) 50%,
      rgba(92, 68, 32, 0.5) 60%,
      transparent 100%);
    box-shadow:
      0 0 4px rgba(92, 68, 32, 0.7),
      inset 0 0 1px rgba(255, 255, 255, 0.6);
    border-radius: 1px;
  }

  /* 左右折痕 */
  .screen-divider .fold-left,
  .screen-divider .fold-right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
  }

  .screen-divider .fold-left { left: 0; }
  .screen-divider .fold-right { right: 0; }

  /* 第1根：左暗右亮 */
  .screen-divider[data-dir="normal"] .fold-left {
    background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.28));
  }
  .screen-divider[data-dir="normal"] .fold-right {
    background: linear-gradient(to left, transparent, rgba(255, 255, 255, 0.42));
  }

  /* 第2根：反向，左亮右暗 */
  .screen-divider[data-dir="reverse"] .fold-left {
    background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.42));
  }
  .screen-divider[data-dir="reverse"] .fold-right {
    background: linear-gradient(to left, transparent, rgba(0, 0, 0, 0.28));
  }

  /* 第3根：左暗右亮 */
  .screen-divider[data-dir="normal2"] .fold-left {
    background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.28));
  }
  .screen-divider[data-dir="normal2"] .fold-right {
    background: linear-gradient(to left, transparent, rgba(255, 255, 255, 0.42));
  }

  .screen-divider .cap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 6px;
    background: linear-gradient(180deg, #d9b779, #8a6428);
    border: 1px solid #5c4420;
    border-radius: 1px;
    z-index: 4;
  }

  .screen-divider .cap.top { top: -4px; }
  .screen-divider .cap.bottom { bottom: -4px; }
</style>
</head>

<body>
<header>
  <div class="logo">🖌丹青画境️ ｜成品交付溯源</div>
  <nav>
    <a href="./index.html">首页</a>
    <a href="./select.html">需求对接归集</a>
    <a href="./preview.html">智能选画与场景预演</a>
    <a href="./color.html">数字调色确认</a>
    <a href="./order.html">成品交付溯源</a>
  </nav>
</header>

<div class="wrap">
  <div class="order-card">
    <h2>订单全流程可视化管理</h2>

    <div class="progress">
      <div class="step"><div class="step-dot">1</div><p>需求提交</p></div>
      <div class="step"><div class="step-dot">2</div><p>设计选画</p></div>
      <div class="step"><div class="step-dot">3</div><p>调色确认</p></div>
      <div class="step"><div class="step-dot grey" id="step4">4</div><p>装裱制作</p></div>
      <div class="step"><div class="step-dot grey" id="step5">5</div><p>发货配送</p></div>
    </div>

    <div class="art-preview">
      <p>当前定制国画（素材来源 <a href="https://hetuwang.cn" target="_blank">hetuwang.cn</a>）</p>

      <div class="frame-preview-wrap" id="frameWrap">
        <div class="inner-frame" id="innerFrame">
          <img id="orderImg" />
        </div>

        <div class="relief-top-light" data-relief-light></div>
        <div class="relief-bottom-shadow" data-relief-shadow></div>

        <!-- 第1根：正常折痕 -->
        <div class="screen-divider" style="left:25%" data-screen data-dir="normal">
          <div class="fold-left"></div>
          <div class="bar"></div>
          <div class="fold-right"></div>
          <div class="cap top"></div>
          <div class="cap bottom"></div>
        </div>

        <!-- 第2根：反向折痕 -->
        <div class="screen-divider" style="left:50%" data-screen data-dir="reverse">
          <div class="fold-left"></div>
          <div class="bar"></div>
          <div class="fold-right"></div>
          <div class="cap top"></div>
          <div class="cap bottom"></div>
        </div>

        <!-- 第3根：正常折痕 -->
        <div class="screen-divider" style="left:75%" data-screen data-dir="normal2">
          <div class="fold-left"></div>
          <div class="bar"></div>
          <div class="fold-right"></div>
          <div class="cap top"></div>
          <div class="cap bottom"></div>
        </div>
      </div>
    </div>

    <div class="param-info">
      <h4 style="color:#8C5A2F;margin-bottom:8px;">调色记录与备注</h4>
      <p id="paramText"></p>
    </div>

    <h3 style="text-align:center;color:#8C5A2F;margin-top:24px;">选择成品工艺（点击预览效果）</h3>

    <div class="frame-grid">
      <div class="frame-item" onclick="selectFrame('frame-in-frame')">
        <h4>画中画</h4>
        <p>内画框实木封边，外框黑胡桃木铜角框，画面采用悬浮工艺</p>
      </div>
      <div class="frame-item" onclick="selectFrame('relief')">
        <h4>浮雕画</h4>
        <p>肌理浮雕工艺，呈现立体线条与立体图形效果</p>
      </div>
      <div class="frame-item" onclick="selectFrame('screen')">
        <h4>蝴蝶结屏风</h4>
        <p>传统蝴蝶结链接，框条连接传统燕尾榫，打磨后融合一体</p>
      </div>
    </div>

    <button class="btn" onclick="submitOrder()">提交订单，进入装裱制作</button>
    <p style="text-align:center">安全包装配送，生成线上订单档案，随时查看进度</p>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  let imgSrc = urlParams.get('img') ? decodeURIComponent(urlParams.get('img')) : "";

  const bright = urlParams.get('bright') || 100;
  const contrast = urlParams.get('contrast') || 100;
  const saturate = urlParams.get('saturate') || 100;
  const hue = urlParams.get('hue') || 0;
  const temp = urlParams.get('temp') || 0;
  const shadow = urlParams.get('shadow') || 0;
  const sharp = urlParams.get('sharp') || 0;
  const rotate = urlParams.get('rotate') || 0;
  const mirror = urlParams.get('mirror') === "true";
  const paperFilter = urlParams.get('paperFilter') === "true";
  const remark = urlParams.get('remark') ? decodeURIComponent(urlParams.get('remark')) : "无备注";

  const orderImgDom = document.getElementById("orderImg");
  const frameWrap = document.getElementById("frameWrap");
  const innerFrame = document.getElementById("innerFrame");
  const paramText = document.getElementById("paramText");
  const reliefLight = document.querySelector("[data-relief-light]");
  const reliefShadow = document.querySelector("[data-relief-shadow]");
  const allDividers = document.querySelectorAll("[data-screen]");

  let currentFrameKey = "";

  // 初始隐藏
  allDividers.forEach(el => el.style.display = "none");
  reliefLight.style.display = "none";
  reliefShadow.style.display = "none";

  // 加载图片并复现调色
  if (imgSrc) {
    orderImgDom.src = imgSrc;

    orderImgDom.onload = function () {
      applyColorFilter();
    };

    if (orderImgDom.complete) {
      applyColorFilter();
    }
  }

  function applyColorFilter() {
    let filters = [];
    filters.push(`brightness(${bright}%)`);
    filters.push(`contrast(${contrast}%)`);
    filters.push(`saturate(${saturate}%)`);
    filters.push(`hue-rotate(${hue}deg)`);

    if (temp < 0) {
      filters.push(`sepia(${Math.abs(temp) / 200})`);
    } else if (temp > 0) {
      filters.push(`saturate(${Number(saturate) + Math.round(temp / 10)}%)`);
    }

    if (shadow != 0) {
      filters.push(`brightness(${Number(bright) + Math.round(shadow / 8)}%)`);
      filters.push(`contrast(${Number(contrast) - Math.round(Math.abs(shadow) / 10)}%)`);
    }

    if (sharp > 0) {
      filters.push(`contrast(${Number(contrast) + Math.round(sharp / 5)}%)`);
      filters.push(`saturate(${Number(saturate) + Math.round(sharp / 8)}%)`);
    }

    if (paperFilter) {
      filters.push(`sepia(0.35)`);
      filters.push(`saturate(115%)`);
    }

    orderImgDom.style.filter = filters.join(" ");

    let scaleX = mirror ? -1 : 1;
    orderImgDom.style.transform = `rotate(${rotate}deg) scaleX(${scaleX})`;
  }

  // 参数展示
  paramText.innerHTML = `
    亮度：${bright}% &nbsp;&nbsp;对比度：${contrast}% &nbsp;&nbsp;饱和度：${saturate}%<br>
    色相：${hue}° &nbsp;&nbsp;色温：${temp} &nbsp;&nbsp;暗部提亮：${shadow} &nbsp;&nbsp;清晰度：${sharp}<br>
    旋转：${rotate}° &nbsp;&nbsp;水平镜像：${mirror ? "开启" : "关闭"} &nbsp;&nbsp;宣纸滤镜：${paperFilter ? "开启" : "关闭"}<br>
    改图备注：${remark}
  `;

  // 切换工艺
  function selectFrame(type) {
    currentFrameKey = type;

    document.body.classList.remove(
      "style-frame-in-frame",
      "style-relief",
      "style-screen"
    );
    document.body.classList.add("style-" + type);

    document.querySelectorAll(".frame-item").forEach(el => el.classList.remove("active"));
    event.currentTarget.classList.add("active");

    // 屏风
    if (type === "screen") {
      allDividers.forEach(el => el.style.display = "block");
    } else {
      allDividers.forEach(el => el.style.display = "none");
    }

    // 浮雕
    if (type === "relief") {
      innerFrame.style.border = "none";
      innerFrame.style.padding = "0";
      reliefLight.style.display = "block";
      reliefShadow.style.display = "block";
    } else {
      innerFrame.style.border = "2px solid #b82626";
      innerFrame.style.padding = "4px";
      reliefLight.style.display = "none";
      reliefShadow.style.display = "none";
    }
  }

  // 提交订单
  function submitOrder() {
    if (!currentFrameKey) {
      alert("请先选择一款成品工艺！");
      return;
    }

    const frameName = {
      "frame-in-frame": "画中画",
      "relief": "浮雕画",
      "screen": "蝴蝶结屏风"
    }[currentFrameKey];

    document.getElementById("step4").classList.remove("grey");
    alert(`订单提交成功！已选择【${frameName}】工艺，订单档案已保存`);
  }
</script>
</body>
</html>
