<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数字调色确认</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', serif;
        }
        body{
            background-color: #F4F0E3;
            background-image: url('https://cdn.pixabay.com/photo/2017/08/02/14/26/paper-2574920_1280.jpg');
            background-repeat: repeat;
            color:#2D2D2D;
        }
        header{
            display:flex;
            justify-content: space-between;
            padding:1rem 6rem;
            border-bottom: 1px solid #8C5A2F50;
            align-items:center;
        }
        .logo{
            font-size:24px;
            font-weight:bold;
        }
        nav a{
            text-decoration:none;
            color:#2D2D2D;
            margin:0 14px;
            font-size:17px;
        }
        .container{
            width:90%;
            margin:30px auto;
            display:grid;
            grid-template-columns: 1fr 320px;
            gap:24px;
        }
        .preview-box{
            background:#fffdf7;
            border:2px solid #8C5A2F;
            border-radius:8px;
            padding:24px;
            text-align:center;
        }
        .preview-box h3{
            color:#8C5A2F;
            margin-bottom:16px;
        }
        #colorImg{
            max-width:80%;
            max-height:500px;
        }
        .control-card{
            background:#fffdf7;
            border:2px solid #8C5A2F;
            border-radius:8px;
            padding:24px;
        }
        .control-card h3{
            color:#8C5A2F;
            text-align:center;
            margin-bottom:20px;
        }
        .slider-item{
            margin-bottom:16px;
        }
        .slider-item label{
            display:block;
            margin-bottom:4px;
        }
        input[type="range"]{
            width:100%;
        }
        textarea{
            width:100%;
            height:100px;
            padding:8px;
            border:1px solid #8C5A2F70;
            border-radius:4px;
        }
        .btn{
            width:100%;
            padding:10px;
            margin-top:10px;
            background:#8C5A2F;
            color:#fff;
            border:none;
            border-radius:4px;
            font-size:16px;
            cursor:pointer;
        }
        .btn:hover{
            background:#704824;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🖌丹青画境｜数字调色确认</div>
        <nav>
            <a href="./index.html">首页</a>
            <a href="./select.html">需求对接归集</a>
            <a href="./preview.html">智能选画与场景预演</a>
            <a href="./color.html">数字调色确认</a>
            <a href="./order.html">成品交付溯源</a>
        </nav>
    </header>
    <div class="container">
        <div class="preview-box">
            <h3>国画调色预览（素材来源：<a href="https://hetuwang.cn" target="_blank">hetuwang.cn</a>）</h3>
            <img id="colorImg">
            <p style="margin-top:12px">调整色彩，一对一在线改图，确认效果图</p>
        </div>
        <div class="control-card">
            <h3>调色控制面板</h3>
            <div class="slider-item">
                <label>亮度</label>
                <input type="range" id="bright" min="0" max="200" value="100">
            </div>
            <div class="slider-item">
                <label>对比度</label>
                <input type="range" id="contrast" min="0" max="200" value="100">
            </div>
            <div class="slider-item">
                <label>饱和度</label>
                <input type="range" id="saturate" min="0" max="200" value="100">
            </div>
            <div class="slider-item">
                <label>改图备注</label>
                <textarea id="remark" placeholder="填写修改需求..."></textarea>
            </div>
            <button class="btn" onclick="confirmColor()">确认调色效果</button>
            <button class="btn" onclick="goOrderPage()">下一步 选择装裱相框 →</button>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let imgSrc = urlParams.get('img') ? decodeURIComponent(urlParams.get('img')) : "";
        const imgDom = document.getElementById("colorImg");
        if(imgSrc){
            imgDom.src = imgSrc;
        }
        // 滤镜调色
        const bright = document.getElementById("bright");
        const contrast = document.getElementById("contrast");
        const saturate = document.getElementById("saturate");
        function updateFilter(){
            imgDom.style.filter = `brightness(${bright.value}%) contrast(${contrast.value}%) saturate(${saturate.value}%)`;
        }
        bright.oninput = updateFilter;
        contrast.oninput = updateFilter;
        saturate.oninput = updateFilter;

        function confirmColor(){
            alert("调色效果图已保存，备注："+document.getElementById('remark').value);
        }
        function goOrderPage(){
            window.location.href = `order.html?img=${encodeURIComponent(imgSrc)}`;
        }
    </script>
</body>
</html>
